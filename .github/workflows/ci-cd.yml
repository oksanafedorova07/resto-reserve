name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop, work/work ]
  pull_request:
    branches: [ main, develop, work/work ]

jobs:
  ci:
    name: 🔍 Run Tests and Linting
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install flake8 psycopg[binary]
          pip install -r requirements.txt

      - name: Run linter (flake8)
        run: |
          flake8 . --exclude=env,migrations,__pycache__

      - name: 🧪 Запустить тесты
        run: |
          python manage.py test --settings=config.settings
        env:
          SECRET_KEY: dummykey
          DEBUG: "False"
          DB_NAME: resto_reserve
          DB_USER: postgres
          DB_PASSWORD: postgres
          DB_HOST: localhost
          DB_PORT: 5432
          TELEGRAM_BOT_TOKEN: test_token
          TELEGRAM_CHAT_ID: test_chat_id
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: resto_reserve
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd=pg_isready
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

  build:
    name: 🐳 Build Docker Images
    runs-on: ubuntu-latest
    needs: ci
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        run: |
          docker build -t resto-reserve:latest .
