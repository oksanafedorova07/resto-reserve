name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop, work/work ]
  pull_request:
    branches: [ main, develop, work/work ]



jobs:
  test:
    name: 🧪 Тестирование и проверка кода
    runs-on: ubuntu-latest
    
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: test_db
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
    - name: 📥 Checkout code
      uses: actions/checkout@v4

    - name: 🐍 Setup Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'

    - name: 📦 Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: 🔧 Setup environment
      run: |
        echo "DEBUG=True" >> .env
        echo "SECRET_KEY=test-secret-key-for-ci" >> .env
        echo "DB_NAME=test_db" >> .env
        echo "DB_USER=test_user" >> .env
        echo "DB_PASSWORD=test_password" >> .env
        echo "DB_HOST=localhost" >> .env
        echo "DB_PORT=5432" >> .env
        echo "TELEGRAM_BOT_TOKEN=test-token" >> .env
        echo "TELEGRAM_CHAT_ID=test-chat-id" >> .env
        echo "ALLOWED_HOSTS=localhost,127.0.0.1" >> .env

    - name: 🗄️ Run migrations
      run: |
        python manage.py migrate

    - name: 🧪 Run tests
      run: |
        python manage.py test --verbosity=2

    - name: 🔍 Run Flake8
      run: |
        pip install flake8
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics


