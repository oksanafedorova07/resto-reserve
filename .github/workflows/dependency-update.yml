name: 🔄 Обновление зависимостей

on:
  schedule:
    # Запуск каждый понедельник в 9:00 UTC
    - cron: '0 9 * * 1'
  workflow_dispatch: # Ручной запуск

jobs:
  update-dependencies:
    name: 📦 Обновление Python зависимостей
    runs-on: ubuntu-latest
    
    steps:
    - name: 📥 Checkout code
      uses: actions/checkout@v4

    - name: 🐍 Setup Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'

    - name: 📦 Install pip-tools
      run: |
        pip install pip-tools

    - name: 🔄 Update requirements
      run: |
        # Обновляем requirements.txt
        pip-compile --upgrade requirements.in
        # Или если используем requirements.txt напрямую
        pip install --upgrade -r requirements.txt
        pip freeze > requirements.txt

    - name: 🧪 Test with updated dependencies
      run: |
        pip install -r requirements.txt
        python manage.py test --verbosity=2

    - name: 📝 Create Pull Request
      uses: peter-evans/create-pull-request@v5
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
        commit-message: 'chore: update dependencies'
        title: '🔄 Обновление зависимостей'
        body: |
          ## 🔄 Автоматическое обновление зависимостей
          
          Этот PR был создан автоматически для обновления зависимостей проекта.
          
          ### 📋 Изменения:
          - Обновлены Python пакеты
          - Проведено тестирование с новыми версиями
          
          ### ✅ Проверки:
          - [x] Тесты проходят
          - [x] Зависимости совместимы
          
          ---
          *Создано автоматически GitHub Actions*
        branch: update-dependencies
        delete-branch: true
